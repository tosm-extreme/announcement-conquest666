<title>Conquest 666 Winners</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700&family=IBM+Plex+Sans+Thai:wght@400;500;600;700&display=swap');
  :root{
    --bg:#F1F3F9; --surface:#FFFFFF; --surface-2:#FAFBFE; --surface-3:#F5F6FB;
    --ink:#1B1D2A; --ink-2:#565A6E; --ink-3:#878CA1;
    --line:#E5E7F0; --line-2:#EEF0F7;
    --accent:#A87715; --accent-2:#8A6110; --accent-soft:#FBF3DD; --accent-line:#EAD7A2;
    --indigo:#3B3A63; --indigo-soft:#EEEEF7;
    --gold:#C9A227; --silver:#93A0B4; --bronze:#B27C4A;
    --shadow:0 1px 2px rgba(24,26,40,.05), 0 10px 30px -14px rgba(24,26,40,.16);
    --shadow-sm:0 1px 2px rgba(24,26,40,.06);
    --sw-t:#AF3628; --wz-t:#573BAE; --ar-t:#1C7A4C; --cl-t:#946200;
    --sc-t:#0E7490; --mu-t:#2D5DA8; --la-t:#A23A86;
    --tone-A:#4E9A51; --tone-S:#E8912B; --tone-SS:#CE2B2B; --tone-TOP20:#B3202F; --tone-TOPCLASS:#8E244A;
    --band-bg:#38366B; --band-ink:#fff; --band-sub:rgba(255,255,255,.82); --band-gly:rgba(255,255,255,.22);
    --toned-A:#3C7C3F; --toned-S:#A85E00; --toned-SS:#B5292A; --toned-TOP20:#9E1E2E; --toned-TOPCLASS:#7C2246;
  }
  :root:not([data-theme="light"]){ @media (prefers-color-scheme:dark){
    --bg:#101118; --surface:#1A1C25; --surface-2:#21232E; --surface-3:#181A23;
    --ink:#ECEDF4; --ink-2:#A2A7B9; --ink-3:#767B90;
    --line:#2C2F3B; --line-2:#252833;
    --accent:#E6BC53; --accent-2:#E8C468; --accent-soft:#2E2717; --accent-line:#4A3F22;
    --indigo:#B7B5E6; --indigo-soft:#232338;
    --gold:#DFB53E; --silver:#98A5B8; --bronze:#C08A55;
    --shadow:0 1px 2px rgba(0,0,0,.3), 0 14px 34px -16px rgba(0,0,0,.6);
    --shadow-sm:0 1px 2px rgba(0,0,0,.35);
    --sw-t:#F0A99F; --wz-t:#C4B0F5; --ar-t:#88D8AB; --cl-t:#E9C978;
    --sc-t:#6FC9DE; --mu-t:#9DBDF0; --la-t:#E5A0CE;
    --tone-A:#63B166; --tone-S:#F0A648; --tone-SS:#E8595A; --tone-TOP20:#E85C67; --tone-TOPCLASS:#D06797;
    --band-bg:#34315C; --band-ink:#EDEEFB; --band-sub:rgba(237,238,251,.72); --band-gly:rgba(255,255,255,.14);
    --toned-A:#3C7C3F; --toned-S:#A85E00; --toned-SS:#B5292A; --toned-TOP20:#9E1E2E; --toned-TOPCLASS:#7C2246;
  }}
  :root[data-theme="dark"]{
    --bg:#101118; --surface:#1A1C25; --surface-2:#21232E; --surface-3:#181A23;
    --ink:#ECEDF4; --ink-2:#A2A7B9; --ink-3:#767B90;
    --line:#2C2F3B; --line-2:#252833;
    --accent:#E6BC53; --accent-2:#E8C468; --accent-soft:#2E2717; --accent-line:#4A3F22;
    --indigo:#B7B5E6; --indigo-soft:#232338;
    --gold:#DFB53E; --silver:#98A5B8; --bronze:#C08A55;
    --shadow:0 1px 2px rgba(0,0,0,.3), 0 14px 34px -16px rgba(0,0,0,.6);
    --shadow-sm:0 1px 2px rgba(0,0,0,.35);
    --sw-t:#F0A99F; --wz-t:#C4B0F5; --ar-t:#88D8AB; --cl-t:#E9C978;
    --sc-t:#6FC9DE; --mu-t:#9DBDF0; --la-t:#E5A0CE;
    --tone-A:#63B166; --tone-S:#F0A648; --tone-SS:#E8595A; --tone-TOP20:#E85C67; --tone-TOPCLASS:#D06797;
    --band-bg:#34315C; --band-ink:#EDEEFB; --band-sub:rgba(237,238,251,.72); --band-gly:rgba(255,255,255,.14);
    --toned-A:#3C7C3F; --toned-S:#A85E00; --toned-SS:#B5292A; --toned-TOP20:#9E1E2E; --toned-TOPCLASS:#7C2246;
  }
  *{box-sizing:border-box}
  body{background:var(--bg);color:var(--ink);font-family:"IBM Plex Sans Thai",system-ui,-apple-system,"Segoe UI",sans-serif;line-height:1.5;-webkit-font-smoothing:antialiased}
  h1,h2,h3{margin:0;line-height:1.2;text-wrap:balance}
  .wrap{max-width:1060px;margin:0 auto;padding-inline:16px}

  /* Header */
  .hero{background:radial-gradient(130% 130% at 92% -25%, var(--accent-soft) 0%, transparent 55%),linear-gradient(180deg,var(--surface),var(--surface-2));border-bottom:1px solid var(--line)}
  .hero .wrap{padding-block:22px 22px}
  .logo{height:62px;width:auto;display:block;image-rendering:-webkit-optimize-contrast;filter:drop-shadow(0 2px 6px rgba(0,0,0,.18))}
  .title{font-family:"Cinzel",serif;font-weight:700;font-size:clamp(28px,6vw,50px);color:var(--ink);line-height:1.03;margin-top:12px}
  .title b{color:var(--accent)}
  .subtitle{margin-top:10px;color:var(--ink-2);font-size:14.5px;max-width:none}
  .meta{margin-top:16px;display:flex;flex-wrap:wrap;gap:8px}
  .chip{display:inline-flex;align-items:center;gap:7px;padding:5px 11px;border-radius:999px;font-size:12.5px;font-weight:500;background:var(--surface);border:1px solid var(--line);color:var(--ink-2)}
  .chip b{color:var(--ink);font-weight:600;font-variant-numeric:tabular-nums}
  .chip .ic{color:var(--accent)}

  /* Prize tabs — prominent */
  .prizebar{background:var(--surface);border-bottom:1px solid var(--line);position:sticky;top:env(safe-area-inset-top,0px);z-index:30}
  .prizetabs{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding:12px 0}
  .prizetabs::-webkit-scrollbar{display:none}
  .ptab{flex:0 0 auto;display:flex;align-items:center;gap:10px;border:1.5px solid var(--line);background:var(--surface-2);border-radius:13px;padding:8px 14px;cursor:pointer;font-family:inherit;transition:.16s;white-space:nowrap}
  .ptab .pdot{width:11px;height:11px;border-radius:3px;background:var(--tone);flex:0 0 auto}
  .ptab .ptxt{display:flex;flex-direction:column;line-height:1.16;text-align:left}
  .ptab .pname{font-size:14px;font-weight:700;color:var(--ink)}
  .ptab .pamt{font-size:10.5px;font-weight:600;color:var(--ink-3);font-variant-numeric:tabular-nums;letter-spacing:.02em}
  .ptab .cnt{font-size:11px;font-weight:700;color:var(--ink-3);background:var(--surface-3);border:1px solid var(--line);border-radius:999px;padding:2px 8px;font-variant-numeric:tabular-nums}
  .ptab:hover{border-color:var(--toned)}
  .ptab[aria-selected="true"]{background:var(--toned);border-color:var(--toned);box-shadow:0 7px 20px -8px var(--tone)}
  .ptab[aria-selected="true"] .pname,.ptab[aria-selected="true"] .pamt{color:#fff}
  .ptab[aria-selected="true"] .pamt{color:rgba(255,255,255,.9)}
  .ptab[aria-selected="true"] .pdot{background:#fff}
  .ptab[aria-selected="true"] .cnt{background:rgba(255,255,255,.24);color:#fff;border-color:transparent}
  .ptab:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

  /* Controls */
  .controls{background:var(--surface-2);border-bottom:1px solid var(--line-2)}
  .controls .wrap{padding-block:11px;display:flex;flex-direction:column;gap:9px}
  .ctl-row{display:flex;align-items:flex-start;gap:11px;min-width:0}
  .ctl-label{flex:0 0 auto;width:50px;padding-top:7px;font-size:10.5px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3)}
  .pills{flex:1 1 auto;min-width:0;display:flex;flex-wrap:wrap;gap:8px}
  .pill{appearance:none;font-family:inherit;cursor:pointer;font-size:13px;font-weight:500;padding:6px 12px;border-radius:999px;border:1px solid var(--line);background:var(--surface);color:var(--ink-2);display:inline-flex;align-items:center;gap:7px;white-space:nowrap;transition:.14s}
  .pill:hover{border-color:var(--accent-line);color:var(--ink)}
  .pill .n{font-size:11px;color:var(--ink-3);font-variant-numeric:tabular-nums}
  .pill[aria-pressed="true"]{background:var(--indigo);border-color:var(--indigo);color:#fff}
  :root[data-theme="dark"] .pill[aria-pressed="true"],:root:not([data-theme="light"]) .pill[aria-pressed="true"]{color:#14151c}
  .pill[aria-pressed="true"] .n{color:inherit;opacity:.72}
  .pill .pill-ic{width:19px;height:19px;border-radius:5px;flex:0 0 auto;margin-left:-2px}
  .pill:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  .searchrow{align-items:center;gap:8px}
  .search{position:relative;display:flex;align-items:center;flex:1 1 auto}
  .search input{font-family:inherit;font-size:13px;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:9px 14px 9px 36px;width:100%;outline:none}
  .search input:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
  .search svg{position:absolute;left:13px;color:var(--ink-3);pointer-events:none}
  .themebtn{flex:0 0 auto;width:40px;height:40px;border-radius:11px;border:1px solid var(--line);background:var(--surface);color:var(--ink-2);display:grid;place-items:center;cursor:pointer;transition:.14s}
  .themebtn:hover{border-color:var(--accent-line);color:var(--ink)}
  .themebtn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

  main .wrap{padding-block:22px 56px}

  /* Reward panel */
  .rewards{border:1px solid var(--line);border-radius:16px;overflow:hidden;background:var(--surface);box-shadow:var(--shadow-sm);margin-bottom:24px}
  .rw-head{display:flex;align-items:center;gap:12px;padding:14px 18px;color:#fff;background:linear-gradient(100deg,var(--tone),color-mix(in srgb,var(--tone) 76%, #000 10%))}
  .rw-head .rw-t{font-family:"Cinzel",serif;font-weight:700;font-size:16px;letter-spacing:.02em;display:flex;align-items:center;gap:10px}
  .rw-head .rw-amt{font-weight:700;font-variant-numeric:tabular-nums}
  .rw-head .rw-sub{margin-left:auto;font-size:12px;font-weight:500;opacity:.94;background:rgba(255,255,255,.18);padding:3px 10px;border-radius:999px;white-space:nowrap}
  .rw-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:1px;background:var(--line-2)}
  .rw-item{background:var(--surface);display:flex;align-items:center;gap:12px;padding:12px 14px}
  .rw-item .ic{width:46px;height:46px;flex:0 0 auto;border-radius:10px;background:var(--surface-3);border:1px solid var(--line);object-fit:contain;padding:3px}
  .rw-item .info{min-width:0;flex:1}
  .rw-item .nm{font-size:13px;font-weight:600;color:var(--ink);line-height:1.25}
  .rw-item .row2{display:flex;align-items:center;gap:8px;margin-top:4px}
  .rw-item .amt{font-size:12px;font-weight:700;color:var(--accent-2);font-variant-numeric:tabular-nums}
  .rw-item .amt .x{color:var(--ink-3);font-weight:500;margin-right:1px}
  .badge-trade{font-size:10.5px;font-weight:600;padding:2px 7px;border-radius:999px;display:inline-flex;align-items:center;gap:4px;background:var(--surface-3);color:var(--ink-3);border:1px solid var(--line)}

  /* Board / leaderboard */
  .board{background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow-sm)}
  .board .brow:last-child{border-bottom:0}
  .bsec{position:sticky;top:calc(env(safe-area-inset-top,0px) + 71px);z-index:15;display:flex;align-items:center;gap:11px;padding:13px 16px;background:var(--band-bg);border-left:4px solid var(--accent);box-shadow:0 6px 14px -8px rgba(0,0,0,.35)}
  .board .bsec:first-child{border-top-left-radius:13px;border-top-right-radius:13px}
  .bsec-name{font-family:"Cinzel",serif;font-weight:700;font-size:16px;color:var(--band-ink);display:flex;align-items:center;gap:10px;letter-spacing:.02em}
  .bsec-name .glyph{width:28px;height:28px;border-radius:8px;display:grid;place-items:center;background:var(--band-gly);color:var(--band-ink);font-size:14px;font-weight:700}
  .bsec-count{font-size:12.5px;color:var(--band-sub);font-variant-numeric:tabular-nums;font-weight:500}
  .bsec-line{display:none}
  .bcols{display:grid;grid-template-columns:58px 176px 1fr 150px 88px;gap:12px;align-items:center;height:38px;padding:0 16px;background:var(--surface-3);border-top:1px solid var(--line);border-bottom:1px solid var(--line);font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3)}
  .bcols .num{text-align:right}
  .brow{display:grid;grid-template-columns:58px 176px 1fr 150px 88px;grid-template-areas:"rank class team score time";gap:4px 12px;align-items:center;padding:11px 16px;min-height:54px;border-bottom:1px solid var(--line-2)}
  .brow:hover{background:var(--surface-2)}
  .brow.top1{background:color-mix(in srgb,var(--accent-soft) 42%,var(--surface))}
  .c-rank{grid-area:rank;justify-self:center}
  .c-class{grid-area:class;display:flex;align-items:center;gap:9px;font-weight:600;font-size:13.5px;min-width:0}
  .c-team{grid-area:team;display:flex;align-items:center;gap:8px;min-width:0;flex-wrap:wrap}
  .c-score{grid-area:score;justify-self:end}
  .c-time{grid-area:time;justify-self:end}
  .num{text-align:right;font-variant-numeric:tabular-nums}
  .cls-ic{width:26px;height:26px;border-radius:7px;flex:0 0 auto;background:var(--surface-3)}
  .c-class.Swordman{color:var(--sw-t)} .c-class.Wizard{color:var(--wz-t)} .c-class.Archer{color:var(--ar-t)} .c-class.Cleric{color:var(--cl-t)} .c-class.Scout{color:var(--sc-t)} .c-class.Musketeer{color:var(--mu-t)} .c-class.Lancer{color:var(--la-t)}
  .rank{display:inline-grid;place-items:center;min-width:26px;height:26px;padding:0 6px;border-radius:8px;font-size:13px;font-weight:600;color:var(--ink-2);background:var(--surface-3);border:1px solid var(--line);font-variant-numeric:tabular-nums}
  .medal{display:inline-grid;place-items:center;width:26px;height:26px;border-radius:50%;font-size:13px;font-weight:700}
  .m1{background:var(--gold);color:#3a2c00} .m2{background:var(--silver);color:#1c2530} .m3{background:var(--bronze);color:#331d09}
  .tm{font-weight:600;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:230px}
  .ch{font-weight:400;color:var(--ink-3);font-size:12px}
  .srvtag{font-size:10.5px;font-weight:600;color:var(--indigo);background:var(--indigo-soft);border-radius:999px;padding:2px 8px}
  .score{font-weight:600;color:var(--ink)} .score.max{color:var(--accent-2)}
  .time{color:var(--ink-2);font-variant-numeric:tabular-nums}
  .sentinel{height:8px}
  .loadmsg{text-align:center;color:var(--ink-3);font-size:12.5px;padding:14px}

  .empty{background:var(--surface);border:1px dashed var(--line);border-radius:14px;padding:44px 24px;text-align:center}
  .empty .big{font-family:"Cinzel",serif;font-size:20px;color:var(--ink-2)}
  .empty p{margin:8px auto 0;color:var(--ink-3);font-size:13.5px;max-width:46ch}
  @media (prefers-reduced-motion:reduce){*{transition:none!important}}
  @media (max-width:600px){
    .bcols{display:none}
    .brow{grid-template-columns:40px auto 1fr auto;grid-template-areas:"rank class team score" "rank class team time";row-gap:1px;padding:9px 12px;min-height:50px}
    .c-class .nm-txt{display:none}
    .c-score,.c-time{font-size:13px}
    .tm{max-width:44vw}
  }
</style>

const PRIZES = [
  {id:"A",  name:"Set A",  amount:"600,000",    total:1553, grouped:true,  sub:"ผู้ผ่านกิจกรรม"},
  {id:"S",  name:"Set S",  amount:"6,000,000",  total:1261, grouped:true,  sub:"รางวัลระดับ S"},
  {id:"SS", name:"Set SS", amount:"16,000,000", total:990,  grouped:true,  sub:"ประมาณ 60–100 คน"},
  {id:"TOP20", name:"Top 20", amount:"", total:20, grouped:false, sub:"20 อันดับแรก รวมทุกเซิร์ฟเวอร์"},
  {id:"TOPCLASS", name:"Top Class", amount:"", total:7, grouped:false, sub:"ที่ 1 ของแต่ละอาชีพ"},
];
const CLASS_ORDER=["Swordman","Wizard","Archer","Cleric","Scout","Musketeer","Lancer"];
const SERVER_ORDER=["Laima","Vakarine","Giltine","Austeja","Jurate"];
const state={prize:"A",server:"all",cls:"all",q:""};
const BATCH=80;
let SEQ=[], RENDERED=0, observer=null;
const $=s=>document.querySelector(s);
const fmt=n=>n.toLocaleString("en-US");
const MAX=99999999;
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function toSec(t){const p=String(t).split(":").map(Number);let h=0,m=0,s=0;if(p.length===3){[h,m,s]=p}else if(p.length===2){[m,s]=p}else{s=p[0]||0}return h*3600+m*60+s}
function fmtTime(t){const p=String(t).split(":").map(Number);let h=0,m=0,s=0;if(p.length===3){[h,m,s]=p}else if(p.length===2){[m,s]=p}else{s=p[0]||0}const mm=String(m).padStart(2,"0"),ss=String(s).padStart(2,"0");return h>0?h+":"+mm+":"+ss:m+":"+ss}
const prizeRecs=id=>DATA.filter(r=>r.prize===id);
const prizeOf=id=>PRIZES.find(p=>p.id===id);
function srvSort(a,b){const ia=SERVER_ORDER.indexOf(a),ib=SERVER_ORDER.indexOf(b);return (ia<0?99:ia)-(ib<0?99:ib)||a.localeCompare(b)}

function buildPrizeTabs(){
  const el=$("#prizeTabs");
  el.innerHTML=PRIZES.map(p=>{
    const n=prizeRecs(p.id).length;
    const amt=p.amount?`<span class="pamt">${esc(p.amount)}</span>`:"";
    return `<button class="ptab" role="tab" data-p="${p.id}" aria-selected="${p.id===state.prize}" style="--tone:var(--tone-${p.id});--toned:var(--toned-${p.id})">
      <span class="pdot"></span><span class="ptxt"><span class="pname">${esc(p.name)}</span>${amt}</span><span class="cnt">${n?fmt(n):"—"}</span></button>`;
  }).join("");
  el.querySelectorAll(".ptab").forEach(b=>b.onclick=()=>{
    state.prize=b.dataset.p;state.server="all";state.cls="all";state.q="";$("#search").value="";
    el.querySelectorAll(".ptab").forEach(x=>x.setAttribute("aria-selected",x===b));
    buildControls();render();window.scrollTo({top:0,behavior:"smooth"});
  });
}
function buildControls(){
  const p=prizeOf(state.prize),recs=prizeRecs(state.prize);
  const srvRow=$("#serverRow");
  if(p.grouped){
    srvRow.hidden=false;
    const servers=[...new Set(recs.map(r=>r.server))].sort(srvSort);
    $("#serverPills").innerHTML=[`<button class="pill" data-s="all" aria-pressed="${state.server==="all"}">ทุกเซิร์ฟเวอร์</button>`]
      .concat(servers.map(s=>`<button class="pill" data-s="${esc(s)}" aria-pressed="${state.server===s}">${esc(s)}</button>`)).join("");
    $("#serverPills").querySelectorAll(".pill").forEach(b=>b.onclick=()=>{state.server=b.dataset.s;sync()});
  }else{ srvRow.hidden=true; state.server="all"; }
  const scope=recs.filter(r=>p.grouped?(state.server==="all"||r.server===state.server):true);
  const present=CLASS_ORDER.filter(c=>scope.some(r=>r.cls===c));
  $("#classPills").innerHTML=[`<button class="pill" data-c="all" aria-pressed="${state.cls==="all"}">ทุกอาชีพ</button>`]
    .concat(present.map(c=>`<button class="pill" data-c="${c}" aria-pressed="${state.cls===c}"><img class="pill-ic" src="${ICONS[c]}" alt="">${c}</button>`)).join("");
  $("#classPills").querySelectorAll(".pill").forEach(b=>b.onclick=()=>{state.cls=b.dataset.c;sync()});
}
function sync(){buildControls();render()}

function rewardPanel(pid){
  const p=prizeOf(pid),items=REWARDS[pid]||[];
  if(!items.length) return "";
  const amt=p.amount?`<span class="rw-amt">${esc(p.amount)}</span>`:"";
  const cells=items.map(it=>`<div class="rw-item">
    <img class="ic" src="${it.img}" alt="${esc(it.name)}" loading="lazy">
    <div class="info"><div class="nm">${esc(it.name)}</div>
      <div class="row2"><span class="amt"><span class="x">×</span>${esc(it.amt)}</span>
        <span class="badge-trade">✕ เทรดไม่ได้</span></div></div></div>`).join("");
  return `<section class="rewards" style="--tone:var(--tone-${pid})">
    <div class="rw-head"><div class="rw-t">🎁 ของรางวัล ${esc(p.name)} ${amt}</div>
      <span class="rw-sub">${esc(p.sub)}</span></div>
    <div class="rw-grid">${cells}</div></section>`;
}

function sectionHead(g,count){
  const nm = g==="__all__" ? `<span class="glyph">★</span>รวมทุกเซิร์ฟเวอร์` : `<span class="glyph">${esc(g[0])}</span>${esc(g)}`;
  return `<div class="bsec"><span class="bsec-name">${nm}</span><span class="bsec-count">${fmt(count)} รายชื่อ</span><span class="bsec-line"></span></div>`;
}
function colHeader(){
  return `<div class="bcols"><span>อันดับ</span><span>Class</span><span>Team Name</span><span class="num">Highscore Point</span><span class="num">Clear Time</span></div>`;
}
function rowHtml(r,rank,grouped){
  const rk = rank<=3 ? `<span class="medal m${rank}">${rank}</span>` : `<span class="rank">${rank}</span>`;
  const srvtag=(!grouped&&r.server&&r.server!=="All")?`<span class="srvtag">${esc(r.server)}</span>`:"";
  return `<div class="brow${rank===1?' top1':''}">
    <div class="c-rank">${rk}</div>
    <div class="c-class ${r.cls}"><img class="cls-ic" src="${ICONS[r.cls]||''}" alt="${r.cls}"><span class="nm-txt">${r.cls}</span></div>
    <div class="c-team"><span class="tm">${esc(r.team||'-')}</span>${r.char?`<span class="ch">${esc(r.char)}</span>`:''}${srvtag}</div>
    <div class="c-score num"><span class="score${r.score>=MAX?' max':''}">${fmt(r.score)}</span></div>
    <div class="c-time num"><span class="time">${fmtTime(r.time)}</span></div>
  </div>`;
}
function buildSeq(recs,p){
  const seq=[];
  const groups = p.grouped ? [...new Set(recs.map(r=>r.server))].sort(srvSort) : ["__all__"];
  for(const g of groups){
    let list = g==="__all__" ? recs.slice() : recs.filter(r=>r.server===g);
    list.sort((a,b)=>b.score-a.score||toSec(a.time)-toSec(b.time));
    seq.push(sectionHead(g,list.length));
    seq.push(colHeader());
    list.forEach((r,i)=>seq.push(rowHtml(r,i+1,p.grouped)));
  }
  return seq;
}
function appendBatch(){
  const board=$("#board"); if(!board) return;
  board.insertAdjacentHTML("beforeend", SEQ.slice(RENDERED,RENDERED+BATCH).join(""));
  RENDERED+=BATCH;
  if(RENDERED>=SEQ.length){ const s=$("#sentinel"); if(s) s.hidden=true; if(observer){observer.disconnect();observer=null;} }
}
function setupObserver(){
  if(observer){observer.disconnect();observer=null;}
  const s=$("#sentinel"); if(!s||s.hidden) return;
  observer=new IntersectionObserver(es=>{es.forEach(e=>{if(e.isIntersecting) appendBatch();});},{rootMargin:"700px 0px"});
  observer.observe(s);
}
function render(){
  const c=$("#content"),p=prizeOf(state.prize);
  let recs=prizeRecs(state.prize);
  if(!recs.length){c.innerHTML=rewardPanel(state.prize)+`<div class="empty"><div class="big">${esc(p.name)}</div><p>ยังไม่มีข้อมูลรายชื่อในหมวดนี้</p></div>`;return}
  if(state.cls!=="all")recs=recs.filter(r=>r.cls===state.cls);
  if(p.grouped&&state.server!=="all")recs=recs.filter(r=>r.server===state.server);
  if(state.q){const q=state.q.toLowerCase();recs=recs.filter(r=>(r.team||"").toLowerCase().includes(q)||(r.char||"").toLowerCase().includes(q))}
  let html=rewardPanel(state.prize);
  if(!recs.length){c.innerHTML=html+`<div class="empty"><div class="big">ไม่พบรายชื่อ</div><p>ไม่มีผู้เล่นที่ตรงกับตัวกรอง ลองปรับ Class หรือคำค้นหาดูนะคะ</p></div>`;return}
  SEQ=buildSeq(recs,p); RENDERED=0;
  c.innerHTML=html+`<div class="board" id="board"></div><div class="sentinel" id="sentinel" aria-hidden="true"></div>`;
  appendBatch();
  setupObserver();
}

function buildHeroMeta(){
  $("#heroMeta").innerHTML=`
    <span class="chip"><span class="ic">◆</span> รางวัล <b>5</b> ประเภท</span>
    <span class="chip"><span class="ic">⚑</span> <b>5</b> เซิร์ฟเวอร์</span>
    <span class="chip"><span class="ic">✦</span> <b>7</b> อาชีพ</span>
    <span class="chip"><span class="ic">◈</span> <b>${fmt(DATA.length)}</b> รายชื่อ</span>`;
}
function curTheme(){const t=document.documentElement.getAttribute("data-theme");return t||(window.matchMedia&&window.matchMedia("(prefers-color-scheme:dark)").matches?"dark":"light")}
function toggleTheme(){const nx=curTheme()==="dark"?"light":"dark";document.documentElement.setAttribute("data-theme",nx);try{localStorage.setItem("c666-theme",nx)}catch(e){}}
try{const s=localStorage.getItem("c666-theme");if(s)document.documentElement.setAttribute("data-theme",s)}catch(e){}
document.addEventListener("click",e=>{if(e.target.closest("#themeBtn"))toggleTheme()});
$("#search").addEventListener("input",e=>{state.q=e.target.value.trim();render()});
buildHeroMeta();buildPrizeTabs();buildControls();render();
</script>
